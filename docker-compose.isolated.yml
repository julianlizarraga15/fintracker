services:
  backend:
    image: ${FINTRACKER_BACKEND_IMAGE:-fintracker-backend:isolation-070cbf5}
    pull_policy: never
    env_file:
      - .isolation-bootstrap
    container_name: fintracker-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - default

  frontend:
    image: ${FINTRACKER_FRONTEND_IMAGE:-875551125619.dkr.ecr.us-east-1.amazonaws.com/fintracker-frontend:latest}
    pull_policy: never
    container_name: fintracker-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - default

networks:
  default:
    external: true
    name: fintracker_default
