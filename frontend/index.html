<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fintracker | Valuations</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums;
        color: #202d29;
        background: #f5f5f0;
        --page: #f5f5f0;
        --surface: #fff;
        --border: #e3e6de;
        --text: #202d29;
        --muted: #727b73;
        --accent: #225b46;
        --accent-soft: #edf3ec;
        --danger: #a32c2c;
        --success: #276444;
        --warning: #805c13;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --radius: 12px;
        --control-height: 40px;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--page); color: var(--text); }
      button, input, select { font: inherit; }
      button { min-height: var(--control-height); padding: 7px 12px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
      button:hover:not(:disabled) { background: #194735; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .app { max-width: 1440px; margin: 0 auto; padding: 20px 28px 56px; display: flex; flex-direction: column; gap: 20px; }
      .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
      .workspace[hidden], .login-panel[hidden] { display: none; }
      .login-panel { max-width: 460px; margin: 8vh auto; width: calc(100% - 32px); }
      .login-panel form { gap: 14px; }
      .login-panel input { width: 100%; }
      .app__header { min-height: 44px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
      .app-links { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
      .app-links a { color:var(--accent); text-decoration:none; }
      h1 { margin:0; font-size:1.25rem; letter-spacing:-.02em; }
      h2 { margin:0; font-size:1.05rem; }
      .subtitle, .hint, .login-status { color:var(--muted); }
      .status-chip { color:var(--muted); font-size:.85rem; }
      .status-chip[data-state="error"] { color:var(--danger); }
      .status-chip[data-state="ready"] { color:var(--success); }
      .status-chip[data-state="loading"] { color:var(--accent); }
      form { display:flex; flex-direction:column; gap:12px; }
      label { font-weight:600; }
      .control, .panel-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      input[type="text"], input[type="password"], input[type="number"], select { min-width:0; height:var(--control-height); padding:7px 10px; border:1px solid #bbc4ce; border-radius:var(--radius); background:#fff; color:var(--text); }
      .control input { flex:1; }
      .secondary-button, .danger-button, .toggle-button, .modal__close { background:#fff; border:1px solid var(--border); color:var(--text); box-shadow:none; }
      .danger-button { color:var(--danger); }
      .panel-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:14px; }
      .hint { margin:4px 0 0; font-size:.85rem; }
      .message { margin-top:8px; font-size:.9rem; }
      .message[data-tone="error"], .login-status[data-tone="error"] { color:var(--danger); }
      .message[data-tone="success"], .login-status[data-tone="success"] { color:var(--success); }
      .auth-grid { display:grid; gap:10px; }
      .portfolio-summary { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(180px,.6fr); gap:24px; align-items:end; }
