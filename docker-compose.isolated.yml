services:
  backend:
    image: ${FINTRACKER_BACKEND_IMAGE:?Set the reviewed backend image}
    pull_policy: never
    env_file:
      - .isolation-bootstrap
    container_name: fintracker-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - default

networks:
  default:
    external: true
    name: fintracker_default
