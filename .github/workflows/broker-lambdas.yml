name: Build broker Lambda image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fintracker-broker-sources

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push single-architecture image
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx build --pull --platform linux/amd64 --provenance=false --sbom=false \
            --load --tag "$image" --file backend/Dockerfile.broker-lambda .
          bash scripts/check_broker_image.sh "$image"
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Image URI: $ECR_REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "BROKER_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Scan pushed image
        run: |
          set -euo pipefail
          scan_ready=0
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$BROKER_IMAGE_DIGEST" && scan_ready=1
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$BROKER_IMAGE_DIGEST" > broker-image-scan.json
          jq '{imageId, imageScanStatus, counts: .imageScanFindings.findingSeverityCounts}' \
            broker-image-scan.json >> "$GITHUB_STEP_SUMMARY"
          [[ "$scan_ready" == 1 ]]
          jq -e '.imageId.imageDigest == env.BROKER_IMAGE_DIGEST and
            .imageScanStatus.status == "COMPLETE" and
            (.imageScanFindings | type == "object") and
            (.imageScanFindings.findingSeverityCounts | type == "object") and
            ((.imageScanFindings.findingSeverityCounts.CRITICAL // 0) == 0) and
            ((.imageScanFindings.findingSeverityCounts.HIGH // 0) == 0)' broker-image-scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broker-image-scan
          path: broker-image-scan.json
          if-no-files-found: warn
