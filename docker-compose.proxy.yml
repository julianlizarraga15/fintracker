services:
  nginx:
    image: nginx:1.31.9-alpine@sha256:90b6bd2aec278b16b98221d64deb1d6d35d164567f507ab0716e6053878315aa
    container_name: fintracker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - default
      - watering-proxy

networks:
  default:
    external: true
    name: fintracker_default
  watering-proxy:
    external: true
    name: watering-proxy
